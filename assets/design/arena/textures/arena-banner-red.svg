          <stop offset="0%" stop-color="#C62828"/>
          <stop offset="50%" stop-color="#8E0000"/>
          <stop offset="100%" stop-color="#3E0000"/>
        </linearGradient>
        <linearGradient id="bn-gold2" x1="0%" y1="0%" x2="100%" y2="100%">
